version: 1

# The integration tests use the sample repositories in tests/fixtures.
# These repositories are outside the documentation inputs for this project.
ignore:
  - "tests/fixtures/**"

documentation:
  instructions:
    - "Before you write each passage, classify it as procedural or descriptive. Apply strict Simplified Technical English. Limit procedural sentences to 20 words. Limit descriptive sentences to 25 words. Put one instruction in each procedural sentence. Put each condition before its command. Do not claim certified ASD-STE100 compliance without the official dictionary."
    - "Use active voice, simple tenses, and full sentences. Keep all necessary grammar. Use one stable term for each concept. Use configuration, owner, export, import, packet, token, acknowledgement, and check consistently. Preserve code, commands, paths, identifiers, product names, and quoted errors exactly. Use make sure that for a required state. Use examine for faults. Use measure for a value. Use invoke for a CLI command."
    - "Start each major document with a one-sentence takeaway. Then give a short mental model. State the owner, current state, and boundaries. Describe the data flow. Describe the error flow. End with one concrete next action. Keep sections short. Limit each list to five items. Give detail progressively."
    - "Connect the document set from outcome through domain, mechanism, boundaries, and continuation. Keep the root README as the continuous entry point. Keep each crate README within its actual ownership boundary. Import short summaries without whole-section duplication. Support claims with repository evidence. Distinguish facts, decisions, manual actions, and unknowns. Keep detailed evidence outside exports."
    - "Use diagrams only for relationships that materially reduce mental reconstruction. Give each diagram one claim. Use labels from source evidence. Give each diagram an accessible description. Add a useful caption with source references. Use self-contained SVG files in docs/diagrams. Do not use Mermaid. Examine every changed diagram with an SVG linter. If a renderer is available, examine each rendered diagram. Update managed import bodies through memoria render. Obtain a fresh packet after edits. Examine changed prose for sentence limits, vocabulary, grammar, conditions, and list structure before acknowledgement."

fingerprints:
  default: raw
