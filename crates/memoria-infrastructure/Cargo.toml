[package]
name = "memoria-infrastructure"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Filesystem, Git, Markdown, hashing, JSON, TOML, and installer adapters for Memoria."

[dependencies]
memoria-domain = { path = "../memoria-domain" }
memoria-application = { path = "../memoria-application" }
pulldown-cmark = { version = "0.13", default-features = false }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }
rustix = { version = "1", features = ["fs", "process", "std"] }
gix-ignore = { version = "=0.22.1", default-features = false }
gix-glob = { version = "=0.27.1", default-features = false }
zstd-safe = { version = "=7.2.4", default-features = false, features = ["std"] }
zstd-sys = { version = "=2.0.16", default-features = false, features = ["std"] }
toml_edit = { version = "0.25.13", default-features = false, features = ["parse", "display"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }

[dev-dependencies]
tempfile = "3"
