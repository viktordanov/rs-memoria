version = 3

# The integration tests use the sample repositories in tests/fixtures.
# These repositories are outside the documentation inputs for this project.
ignore = ["tests/fixtures/**"]
include = []

[documentation]
guidance = [
    "Before you write documentation, read docs/development/writing-guide.md. It adapts the reader-shaped-writing approach to Memoria and decides the shape of a page: its reader, its mode (decide, learn, do, or look up), where each fact lives, and how the explanation connects. Then locate the simple-english and i-have-adhd skills in your agent environment and load each full SKILL.md and the references it names. If either skill is unavailable, stop before documentation edits and report the missing skill by name. Do not substitute remembered rules for either skill. Use skill names without machine-specific paths. Apply simple-english in its pragmatic mode, not strict mode, for sentence mechanics: one instruction per sentence, condition before command, active voice, simple tenses, complete grammar, and one name for each concept. Keep the project's own technical words, and do not force dictionary vocabulary such as invoke, examine, or measure into prose. Choose one plain verb for each action, for example run for a command, and keep it. Apply i-have-adhd to scanning aids: a first sentence that carries each section's point, numbered multi-step work, short or grouped lists, and one concrete next step at the end. When these rules conflict, the writing guide wins: keep a sentence whole when splitting it would delete its because or unless, keep the reason for each rule, and open a page with what its mode needs, not always with an action.",
    "Memoria's documentation has three kinds of page, and each kind has its own voice and reading mode. Guides (docs/workflow.md, docs/concepts.md, the cookbooks, and any concept or authoring guide) are concept-led and approachable: they explain the reader's problem, show a small example, name the tradeoff, and let the reader choose. A concept guide or a cookbook is read to learn, and a workflow is read to do a task. Reference pages (docs/cli.md, docs/state.md, docs/agents.md, docs/github-actions.md, docs/integrations.md, and the changelog) are look-up material: exact arguments, diagnostics, exit statuses, limits, and the state change after each command, in short controlled sentences. Nested READMEs are look-up pages for one boundary: what it owns, the ideas a reader needs to work there, where to start reading, and what the rest of the project expects from it. The root README is the look-up page for a new consumer. No kind of page is a code inventory. Do not restate what the code does line by line.",
    "Teach Memoria through its three structures and one cycle, and use the same words for them on every page. The file tree comes from Git. Document scopes come from folders: a document covers the selected files in its own folder and below it, until it hands a subfolder to a tracked document there by a link or an import. The import graph comes from explicit export and import markers: an export is a boundary's public summary, an import is a declared dependency, and imports are the only edges that carry freshness between documents. A link to a tracked document in a subfolder hands that subfolder over; any other link is navigation and creates no dependency. The cycle is: inputs change, the owning document becomes pending, Memoria states what the review must read, a person or an agent judges the explanation, and an acknowledgement records that judgment against one exact snapshot. Explain each term before you rely on it. Show a small file tree or a diagram wherever a structure is introduced.",
    "Where a page asks the reader to decide, give the purpose, an example, the tradeoff, and the choice: when to add a README boundary, when to export a summary, when to import instead of link, when to ignore a reference document, and when to map a section. Say plainly what a passing check proves and what it does not prove. Keep the facts exact: preserve commands, flags, paths, identifiers, product names, and quoted errors. Keep the whole-document review requirement, the fresh-manifest rule before acknowledgement, and every stated safety limit. Never describe a section mapping, a smaller manifest, or a token as proof of understanding or as a measured saving.",
    "Write the root README for a new consumer. Lead with the product, the reader's problem, common use cases, and a quick start. Keep the complete top-level memoria --help output as an export owned by src/README.md and a managed import in the root README. Link readers to guides and boundaries before repository internals, and keep the self-demo as evidence after the consumer workflow. Import short summaries from nested READMEs instead of repeating their sections. Give every nested README enough local context to stand alone, and support claims with repository evidence.",
    "Give a page the structure its reader and mode need, not a fixed template. A long page gets an early contents list that adds a reading order or reader groups; a short page does not. Keep sections and lists short, and split a long list into what to do now and what can wait. Use connected prose, not a run of isolated sentences. Use GitHub-compatible Mermaid inside Markdown for explanatory diagrams: one claim for each diagram, neutral wording, default rendering with no theme or color overrides, a short accessible description, and a source reference. Check Mermaid syntax before acknowledgement. The one exception is docs/cookbooks/: cookbook pages can try out SVG diagrams drawn with scripts/ascii-diagram.py in the style that docs/cookbooks/README.md defines. Do not use that SVG style on other pages. Update managed import bodies only through memoria render. After any edit, capture a fresh manifest and read the changed prose against this guidance before you acknowledge.",
]
guidance_files = ["docs/development/writing-guide.md"]

[fingerprints]
default = "raw"
languages = {}

[lint]
missing_import_hint = true
