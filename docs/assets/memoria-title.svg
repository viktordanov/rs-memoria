<svg xmlns="http://www.w3.org/2000/svg" width="720" height="414" viewBox="0 0 720 414" role="img" aria-labelledby="title desc">
<title id="title">Memoria: people and agents write the documentation, and when the code it describes changes, Memoria says which document to review.</title>
<desc id="desc">The word MEMORIA in dithered block letters, with the line: keeps written knowledge connected to the code it explains. Below it, a box of documents that people and agents write: README.md and AGENTS.md are current, and src/auth/README.md is marked review. A second box holds the code: src/main.rs, src/db/pool.rs, and src/auth/login.rs, which is edited. One arrow labelled memoria runs from the edited login.rs to src/auth/README.md. A closing line says that memoria review names the document to read again, shows what changed, and records the review.</desc>
