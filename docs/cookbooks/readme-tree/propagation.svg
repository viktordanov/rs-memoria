<svg xmlns="http://www.w3.org/2000/svg" width="990" height="486" viewBox="0 0 990 486" role="img" aria-labelledby="title desc">
<title id="title">Only a changed summary carries a code change to the root README</title>
<desc id="desc">Two panels. A refactor in services/api makes only services/api/README.md pending. Its review ends with no-update, the export does not change, and the root README stays current. A behavior change makes services/api/README.md pending, the reviewer edits its exported summary, then memoria render updates the root import, and the root README gets its own review with imports_changed.</desc>
