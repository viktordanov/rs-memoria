<svg xmlns="http://www.w3.org/2000/svg" width="882" height="342" viewBox="0 0 882 342" role="img" aria-labelledby="title desc">
<title id="title">Two agent instruction files share two section guides</title>
<desc id="desc">AGENTS.md and CLAUDE.md each have a commands section that maps justfile and Cargo.toml and a guide-only boundaries section. Each commands section names the agent-commands guide and each boundaries section names the agent-rules guide. memoria.toml registers both guides, which are never sources or documents.</desc>
