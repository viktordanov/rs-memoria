<svg xmlns="http://www.w3.org/2000/svg" width="765" height="306" viewBox="0 0 765 306" role="img" aria-labelledby="title desc">
<title id="title">Both agent instruction files name the same two section guides</title>
<desc id="desc">AGENTS.md and CLAUDE.md each have a commands section and a boundaries section. Both commands sections name the guide docs/templates/agent-commands.md, which asks for the command, directory, when to run it, and its success signal. Both boundaries sections name docs/templates/agent-rules.md, which asks for the rule, its reason, and a safe alternative.</desc>
