<svg xmlns="http://www.w3.org/2000/svg" width="981" height="306" viewBox="0 0 981 306" role="img" aria-labelledby="title desc">
<title id="title">A section guide edit reaches only the documents that name the guide</title>
<desc id="desc">Two panels. Editing project guidance in memoria.toml lists all four documents in memoria guidance --changed. Editing the agent-commands section guide lists only AGENTS.md and CLAUDE.md, and README.md and src/README.md stay unchanged. Neither edit makes a document pending.</desc>
