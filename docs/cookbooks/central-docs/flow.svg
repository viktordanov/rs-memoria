<svg xmlns="http://www.w3.org/2000/svg" width="846" height="360" viewBox="0 0 846 360" role="img" aria-labelledby="title desc">
<title id="title">A summary change travels from the code to the docs page through one import</title>
<desc id="desc">Six steps in two columns. 1, login.rs changes and src/auth/README.md is pending while docs/guide.md stays current. 2, the README edits its exported summary, and the guide waits with input changed. 3, the README is acknowledged and the guide is pending, render first. 4, memoria render copies the summary into the import body. 5, the guide is reviewed with imports_changed. 6, the guide is acknowledged and current. If the summary stays the same, the flow stops after step 1.</desc>
