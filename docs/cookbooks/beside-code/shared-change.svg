<svg xmlns="http://www.w3.org/2000/svg" width="945" height="432" viewBox="0 0 945 432" role="img" aria-labelledby="title desc">
<title id="title">One change to tax.rs makes every document in billing/ pending, and one section is suggested</title>
<desc id="desc">billing/tax.rs changes. billing/README.md, billing/design.md, and billing/notes.md all cover billing/, so all three become pending and each gets its own review. design.md maps a section to tax.rs, so its review is a focused candidate that suggests the tax section. README.md and notes.md have no section that maps tax.rs, so their reviews are full baselines. Every review still reads the whole document.</desc>
