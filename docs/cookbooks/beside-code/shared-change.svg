<svg xmlns="http://www.w3.org/2000/svg" width="810" height="270" viewBox="0 0 810 270" role="img" aria-labelledby="title desc">
<title id="title">One change to tax.rs asks for three reviews, one for each document in billing/</title>
<desc id="desc">billing/tax.rs changes. billing/README.md, billing/design.md, and billing/notes.md all cover billing/, so all three become pending and each gets its own review. Only design.md has a section that maps tax.rs, so only its review is a focused candidate that suggests the tax section. The other two reviews are full baselines. Every review still reads the whole document.</desc>
