<svg xmlns="http://www.w3.org/2000/svg" width="873" height="216" viewBox="0 0 873 216" role="img" aria-labelledby="title desc">
<title id="title">A literal path breaks when its file is renamed, and a pattern follows renamed and new files</title>
<desc id="desc">The release section of deploy/runbook.md can map files in two ways. The literal path deploy.sh matches nothing after the rename to release.sh, so lint warns section_mapping_invalid. The pattern *.sh matches the renamed release.sh and the new rollback.sh with no edit to the marker.</desc>
