<svg xmlns="http://www.w3.org/2000/svg" width="801" height="234" viewBox="0 0 801 234" role="img" aria-labelledby="title desc">
<title id="title">A marked page beside the code covers its folder, just like the README there</title>
<desc id="desc">In billing/, README.md is tracked by its name and design.md is tracked by its Memoria marker. Both documents cover the same files of the folder: invoice.rs, tax.rs, and notes.md. notes.md has no marker, so it is a source of both documents, not a document.</desc>
