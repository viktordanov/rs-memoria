<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 727" role="img" aria-label="Acknowledgement compares the packet and current inputs before it saves review state.">
  <title>Acknowledgement compares the packet and current inputs before it saves review state.</title>
  <desc>The reviewer receives a packet, examines the inputs, and requests acknowledgement with the packet token. The application compares the current inputs under a write lock. If the inputs change, the command exits with status 3 before it saves review state.</desc>
  <style>
    :root {
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;

      --surface: #FFFCF7;
      --ink: #241E18;
      --ink-2: #4B4035;
      --muted: #716253;
      --hairline: #E6DACB;
      --hairline-strong: #B7A58F;

      --a: #A8511B;
      --b: #16736A;
      --c: #8C5A34;
      --danger: #A03830;

      --tint-a: #F6EBE1;
      --tint-b: #E4F0EE;
      --tint-c: #F2E8DA;
      --tint-d: #F7E7E4;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --surface: #111111;
        --ink: #F3EADF;
        --ink-2: #D2C5B6;
        --muted: #B3A391;
        --hairline: #342D26;
        --hairline-strong: #655545;

        --a: #E28D4F;
        --b: #4FBEAB;
        --c: #D3A37F;
        --danger: #EE8B81;

        --tint-a: #2A1D14;
        --tint-b: #12292A;
        --tint-c: #2B2119;
        --tint-d: #2C1917;
      }
    }

    :root[data-theme="dark"] {
      --surface: #111111;
      --ink: #F3EADF;
      --ink-2: #D2C5B6;
      --muted: #B3A391;
      --hairline: #342D26;
      --hairline-strong: #655545;

      --a: #E28D4F;
      --b: #4FBEAB;
      --c: #D3A37F;
      --danger: #EE8B81;

      --tint-a: #2A1D14;
      --tint-b: #12292A;
      --tint-c: #2B2119;
      --tint-d: #2C1917;
    }

    /* Scroll container — wide diagrams scroll instead of crushing. */
    .canvas {
      background: var(--surface);
      border: 1px solid var(--hairline);
      padding: 20px;
      overflow-x: auto;
    }

    .canvas svg { display: block; width: 100%; min-width: 720px; height: auto; }

    /* Shapes */
    .diagram-bg { fill: #FFFCF7; fill: var(--surface); }
    .sBox { fill: #FFFCF7; fill: var(--surface); stroke-width: 1.5; }
    .sA { stroke: #A8511B; stroke: var(--a); }
    .sB { stroke: #16736A; stroke: var(--b); }
    .sC { stroke: #8C5A34; stroke: var(--c); }
    .sD { stroke: #A03830; stroke: var(--danger); }
    .sN { stroke: #B7A58F; stroke: var(--hairline-strong); }
    .fA { fill: #A8511B; fill: var(--a); }
    .fB { fill: #16736A; fill: var(--b); }
    .fC { fill: #8C5A34; fill: var(--c); }
    .fD { fill: #A03830; fill: var(--danger); }
    .fN { fill: #B7A58F; fill: var(--hairline-strong); }

    /* Fills for grouping blocks — draw BEFORE the marks they sit behind. */
    .tintA { fill: #F6EBE1; fill: var(--tint-a); stroke: none; }
    .tintB { fill: #E4F0EE; fill: var(--tint-b); stroke: none; }
    .tintC { fill: #F2E8DA; fill: var(--tint-c); stroke: none; }
    .tintD { fill: #F7E7E4; fill: var(--tint-d); stroke: none; }

    /* Lines */
    .msg  { fill: none; stroke-width: 1.5; }        /* messages and connectors */
    .dash { stroke-dasharray: 5 4; }                /* returns, "implements" */
    .ll   { stroke: #B7A58F; stroke: var(--hairline-strong); stroke-dasharray: 3 5; stroke-width: 1; }  /* lifelines */
    .band { fill: none; stroke: #E6DACB; stroke: var(--hairline); stroke-dasharray: 3 5; stroke-width: 1; }

    /* Text */
    .tT    { font: 600 13px sans-serif; font: 600 13px var(--sans); fill: #241E18; fill: var(--ink); }      /* box title */
    .tHead { font: 600 12px sans-serif; font: 600 12px var(--sans); fill: #241E18; fill: var(--ink); }      /* participant header */
    .tS    { font: 400 10.5px monospace; font: 400 10.5px var(--mono); fill: #716253; fill: var(--muted); }  /* box subline */
    .tL    { font: 500 10.5px monospace; font: 500 10.5px var(--mono); fill: #4B4035; fill: var(--ink-2); }  /* arrow label */
    .tLm   { font: 400 10px monospace; font: 400 10px var(--mono); fill: #716253; fill: var(--muted); }    /* caveat, condition */
    .tBand { font: 700 10.5px sans-serif; font: 700 10.5px var(--sans); letter-spacing: .12em; } /* + fA/fB/fC */
  .tintN { fill: #FFFCF7; fill: var(--surface); stroke: #B7A58F; stroke: var(--hairline-strong); }
</style>
    <defs>
      <marker id="ar-n" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
        <polygon points="0,0 10,4 0,8" class="fN" />
      </marker>
      <marker id="ar-a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
        <polygon points="0,0 10,4 0,8" class="fA" />
      </marker>
      <marker id="ar-b" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
        <polygon points="0,0 10,4 0,8" class="fB" />
      </marker>
      <marker id="ar-c" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
        <polygon points="0,0 10,4 0,8" class="fC" />
      </marker>
      <marker id="ar-d" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
        <polygon points="0,0 10,4 0,8" class="fD" />
      </marker>
    </defs>
  <rect class="diagram-bg" x="0" y="0" width="1160" height="727" />
  <rect class="tintA" x="400" y="396" width="750" height="220" />
  <text class="tLm" x="1140" y="412" text-anchor="end">Project write lock</text>
  <rect class="sBox sN" x="0" y="20" width="170" height="48" />
  <text class="tHead" x="85" y="41" text-anchor="middle">Reviewer</text>
  <text class="tS" x="85" y="57" text-anchor="middle">human or agent</text>
  <line class="ll" x1="85" y1="68" x2="85" y2="702" />
  <rect class="sBox sA" x="330" y="20" width="170" height="48" />
  <text class="tHead" x="415" y="41" text-anchor="middle">Application</text>
  <text class="tS" x="415" y="57" text-anchor="middle">use cases</text>
  <line class="ll" x1="415" y1="68" x2="415" y2="702" />
  <rect class="sBox sC" x="660" y="20" width="170" height="48" />
  <text class="tHead" x="745" y="41" text-anchor="middle">Adapters</text>
  <text class="tS" x="745" y="57" text-anchor="middle">application ports</text>
  <line class="ll" x1="745" y1="68" x2="745" y2="702" />
  <rect class="sBox sB" x="990" y="20" width="170" height="48" />
  <text class="tHead" x="1075" y="41" text-anchor="middle">ReviewState</text>
  <text class="tS" x="1075" y="57" text-anchor="middle">domain value</text>
  <line class="ll" x1="1075" y1="68" x2="1075" y2="702" />
  <line class="msg sN" x1="85" y1="104" x2="409" y2="104" marker-end="url(#ar-n)" />
  <text class="tL" x="95" y="98">prepare_review::run</text>
  <path class="msg sA" d="M415,138 h46 v20 h-40" marker-end="url(#ar-a)" />
  <text class="tL" x="470" y="134">snapshot::build</text>
  <text class="tLm" x="470" y="150">Port reads supply repository facts.</text>
  <line class="msg sA dash" x1="415" y1="192" x2="91" y2="192" marker-end="url(#ar-a)" />
  <text class="tL" x="405" y="186" text-anchor="end">FocusedReviewPacket + token</text>
  <rect class="tintN" x="10" y="212" width="1125" height="26" />
  <text class="tL" x="20" y="230">The reviewer examines inputs. After a text edit, a fresh packet captures the final text.</text>
  <line class="msg sN" x1="85" y1="266" x2="409" y2="266" marker-end="url(#ar-n)" />
  <text class="tL" x="95" y="260">ack::run</text>
  <line class="msg sA" x1="415" y1="300" x2="739" y2="300" marker-end="url(#ar-a)" />
  <text class="tL" x="425" y="294">ReviewPacketCodec::decode</text>
  <path class="msg sA" d="M415,334 h46 v20 h-40" marker-end="url(#ar-a)" />
  <text class="tL" x="470" y="330">verify_packet</text>
  <text class="tLm" x="470" y="346">Content hashes and token must match.</text>
  <line class="msg sA" x1="415" y1="388" x2="739" y2="388" marker-end="url(#ar-a)" />
  <text class="tL" x="425" y="382">WriteCoordinator::lock</text>
  <path class="msg sA" d="M415,422 h46 v20 h-40" marker-end="url(#ar-a)" />
  <text class="tL" x="470" y="418">snapshot::build</text>
  <text class="tLm" x="470" y="434">Compare inputs and provider state.</text>
  <line class="msg sA" x1="415" y1="476" x2="1069" y2="476" marker-end="url(#ar-a)" />
  <text class="tL" x="425" y="470">ReviewState::acknowledge</text>
  <path class="msg sA" d="M415,510 h46 v20 h-40" marker-end="url(#ar-a)" />
  <text class="tL" x="470" y="506">snapshot::build</text>
  <text class="tLm" x="470" y="522">Final comparison before the state save.</text>
  <rect class="tintD" x="326" y="550" width="809" height="26" />
  <text class="tL" x="336" y="568">If inputs or providers changed, acknowledgement exits 3 without a state save.</text>
  <line class="msg sA" x1="415" y1="604" x2="739" y2="604" marker-end="url(#ar-a)" />
  <text class="tL" x="425" y="598">StateStore::save</text>
  <line class="msg sA dash" x1="415" y1="638" x2="91" y2="638" marker-end="url(#ar-a)" />
  <text class="tL" x="405" y="632" text-anchor="end">AckReport</text>
</svg>
