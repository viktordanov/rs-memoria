name: Acceptance

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing source tag or commit to validate
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: acceptance-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # The `changes` job picks one mode for a push or pull request:
  #   none  only site/ changed: the landing page, which Memoria ignores and no
  #         test reads, so nothing runs.
  #   docs  only documentation changed, perhaps with site/: the short `docs`
  #         job runs. Documentation is Markdown outside skills/ (the skill is
  #         compiled into the binary) and outside tests/fixtures/ (every suite
  #         reads fixtures), anything under docs/, and the Memoria review state
  #         and configuration.
  #   full  anything else, an unknown base commit, or a manual run.
  changes:
    name: Classify the change
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the changed paths
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          base=""
          case "$EVENT" in
            push) base="$PUSH_BEFORE" ;;
            pull_request) base="$(git merge-base "$PR_BASE" "$head" 2>/dev/null || true)" ;;
          esac
          mode=full
          if [ -n "$base" ] && ! printf '%s' "$base" | grep -qE '^0+$' \
            && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$base" "$head")"
            printf 'Changed paths since %s:\n%s\n' "$base" "$files"
            rest="$(printf '%s\n' "$files" | grep -vE '^site/' || true)"
            code="$(printf '%s\n' "$rest" | grep -E '^(skills|tests/fixtures)/' || true)"
            other="$(printf '%s\n' "$rest" | grep -vE '^(skills|tests/fixtures)/' \
              | grep -vE '^(docs/.+|memoria\.(lock|toml)|(.+/)?README\.memoria\.toml|(.+/)?[^/]+\.md)$' || true)"
            if [ -n "$files" ] && [ -z "$rest" ]; then
              mode=none
            elif [ -n "$files" ] && [ -z "$code" ] && [ -z "$other" ]; then
              mode=docs
            fi
          else
            echo "No comparable base commit: run the full build."
          fi
          echo "mode=${mode}"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"

  docs:
    name: Documentation checks
    needs: changes
    if: needs.changes.outputs.mode == 'docs'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.146

      # These suites compare documentation with real runs: every cookbook
      # page and the root README's "CLI at a glance" (cookbook_*), the agent
      # instructions cookbook (guidance), and the manifest example in
      # docs/cli.md (sections). The Git wrapper is the one the full test step
      # uses.
      - name: Test the documentation against real runs
        env:
          MEMORIA_CI_GIT: /usr/bin/git
        run: |
          set -euo pipefail
          wrapper_dir="$RUNNER_TEMP/memoria-ci-git"
          mkdir -p "$wrapper_dir"
          cat > "$wrapper_dir/git" <<'SH'
          #!/bin/sh
          exec "$MEMORIA_CI_GIT" -c maintenance.auto=false -c gc.auto=0 "$@"
          SH
          chmod 755 "$wrapper_dir/git"
          export PATH="$wrapper_dir:$PATH"
          cargo nextest run --locked --test integration --no-fail-fast \
            -E 'test(/^cookbook_/) | test(/^guidance::/) | test(/^sections::/)'

      - name: Self-hosted documentation check
        run: |
          set -euo pipefail
          cargo build --locked --bin memoria
          ./target/debug/memoria lint --format json
          ./target/debug/memoria check --format json

  checks:
    name: Rust checks and CLI acceptance on Linux
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Show the execution environment
        run: |
          set -euo pipefail
          uname -s -r -m
          git --version
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Install cargo-nextest
        # nextest runs every test in its own process, in parallel across the
        # test binaries. The action installs a prebuilt, checksum-verified
        # release of the pinned version.
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.146

      - name: Test
        # The fixture harness disables background Git maintenance for its own
        # Git commands. This command wrapper does the same for every other Git
        # invocation, so maintenance never writes into a .git snapshot. It
        # changes no repository or global Git configuration.
        # nextest does not run doc tests, so `cargo test --doc` runs them.
        env:
          MEMORIA_CI_GIT: /usr/bin/git
        run: |
          set -euo pipefail
          wrapper_dir="$RUNNER_TEMP/memoria-ci-git"
          mkdir -p "$wrapper_dir"
          cat > "$wrapper_dir/git" <<'SH'
          #!/bin/sh
          exec "$MEMORIA_CI_GIT" -c maintenance.auto=false -c gc.auto=0 "$@"
          SH
          chmod 755 "$wrapper_dir/git"
          export PATH="$wrapper_dir:$PATH"
          cargo nextest run --workspace --locked --no-fail-fast
          cargo test --workspace --locked --doc

      - name: Build the release binary
        run: cargo build --release --locked

      - name: CLI acceptance
        run: ./scripts/check-next-change-set.sh --binary ./target/release/memoria --agent-tests simulated

      - name: Self-hosted documentation check
        run: |
          set -euo pipefail
          ./target/release/memoria lint --format json
          ./target/release/memoria check --format json
          ./target/release/memoria status --format json
          ./target/release/memoria status --summary --format json
          ./target/release/memoria state inspect --format json

  darwin-cross-build:
    name: Cross-compile macOS binaries on Linux
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      # This is the recipe the existing release workflow uses. Acceptance
      # reuses it to prove build compatibility for both Apple targets.
      # A successful cross-build does not prove macOS runtime behavior,
      # locking, or filesystem durability.
      - name: Compile both Apple targets
        env:
          BUILD_IMAGE: ghcr.io/rust-cross/cargo-zigbuild@sha256:9b4f6b3eb9e8f9fefb3960fe288ddba576627d66d9eff851ce7f62d2455564a5
        run: |
          set -euo pipefail
          docker run --rm \
            --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/io" \
            --workdir /io \
            "$BUILD_IMAGE" \
            sh -c '
              set -eu
              rustup target add aarch64-apple-darwin x86_64-apple-darwin
              rustc --version
              cargo --version
              cargo zigbuild --release --locked --target aarch64-apple-darwin --bin memoria
              cargo zigbuild --release --locked --target x86_64-apple-darwin --bin memoria
            '

      - name: Inspect the produced binaries
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            binary="target/${target}/release/memoria"
            test -x "$binary"
            if [ "$target" = "aarch64-apple-darwin" ]; then
              file "$binary" | grep -q 'Mach-O 64-bit arm64'
            else
              file "$binary" | grep -q 'Mach-O 64-bit x86_64'
            fi
            printf '%s: %s\n' "$target" "$(file "$binary")"
          done

      - name: Package the acceptance archives
        env:
          TAG: v0.4.0
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          mkdir -p dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            binary="target/${target}/release/memoria"
            staging="dist/stage-${target}"
            asset="memoria-${TAG}-${target}.tar.gz"

            mkdir -p "$staging"
            install -m 755 "$binary" "$staging/memoria"
            install -m 644 LICENSE "$staging/LICENSE"
            tar --sort=name --mtime="@${source_date_epoch}" \
              --owner=0 --group=0 --numeric-owner \
              -C "$staging" -czf "dist/${asset}" LICENSE memoria
            (cd dist && sha256sum "$asset" > "${asset}.sha256")
          done
          ls -l dist

  linux-release-acceptance:
    name: Reproducible ${{ matrix.target }} build and native run
    needs: changes
    if: needs.changes.outputs.mode == 'full'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - name: Record the builder environment
        run: |
          set -euo pipefail
          cat /etc/os-release
          uname -s -r -m
          docker version --format '{{.Server.Version}}'

      - name: Build twice from the pinned builder image
        run: |
          set -euo pipefail
          version="$(grep -A5 '^\[workspace.package\]$' Cargo.toml | grep -m1 '^version = ' | cut -d '"' -f 2)"
          asset="memoria-${version}-${{ matrix.target }}.tar.gz"
          ./scripts/build-linux-release.sh --target '${{ matrix.target }}' --output build-a
          ./scripts/build-linux-release.sh --target '${{ matrix.target }}' --output build-b
          cmp build-a/memoria build-b/memoria
          cmp "build-a/${asset}" "build-b/${asset}"
          ( cd build-a && sha256sum -c "${asset}.sha256" )
          cat build-a/provenance.txt

      - name: Run the produced executable natively
        run: |
          set -euo pipefail
          version="$(grep -A5 '^\[workspace.package\]$' Cargo.toml | grep -m1 '^version = ' | cut -d '"' -f 2)"
          test "$(./build-a/memoria --version)" = "memoria ${version}"
          file ./build-a/memoria
          ./scripts/check-next-change-set.sh --binary ./build-a/memoria --agent-tests simulated
          ./scripts/check-github-workflow-template.sh \
            --binary ./build-a/memoria --output "$RUNNER_TEMP/generated-consumer.yml"
